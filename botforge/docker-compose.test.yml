# Local development only — production uses native installs on EC2
# Usage: docker compose up -d (starts PostgreSQL + Redis for dev)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: botforge
      POSTGRES_USER: botforge
      POSTGRES_PASSWORD: botforge  # pragma: allowlist secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: botforge_test
      POSTGRES_USER: botforge
      POSTGRES_PASSWORD: botforge  # pragma: allowlist secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
