# =============================================================================
# BotForge Redis Production Configuration
# Optimized for EC2 m7i-flex.large (8GB RAM) — limits Redis to 256MB
# =============================================================================

# Network — localhost only (no external access)
bind 127.0.0.1 ::1
port 6379
protected-mode yes

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (lightweight AOF)
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb

# Disable RDB snapshots (AOF is sufficient)
save ""

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Connection limits
maxclients 128
timeout 300
tcp-keepalive 60

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
